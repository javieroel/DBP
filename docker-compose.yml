# Servicios Docker del proyecto.
#   Desarrollo (PC con Docker Desktop):   docker compose up -d db adminer
#   Todo en contenedores (Ubuntu Server): docker compose --profile full up -d --build
#   Con HTTPS (proxy Caddy):              docker compose --profile full --profile https up -d --build
# Las credenciales se leen del archivo .env (no se escriben aquí).
services:
  db:
    image: postgres:16-alpine
    container_name: incidentes_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Solo escucha en 127.0.0.1: la base NO queda expuesta a la red.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # los datos sobreviven si el contenedor se borra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    # Interfaz web para ver la base (capturas de tablas y datos)
    image: adminer:4
    container_name: incidentes_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

  app:
    profiles: ["full"]
    build: .
    container_name: incidentes_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db # dentro de la red de Docker la base se llama "db"
      DB_PORT: 5432
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Con HTTPS activo use APP_PORT=127.0.0.1:3000 para que la API solo se alcance a través de Caddy
      - "${APP_PORT:-3000}:3000"

  caddy:
    # Proxy inverso HTTPS (Unidad 6). Cifra el tráfico entre el navegador y la plataforma.
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: incidentes_https
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificados y la CA local de Caddy
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
